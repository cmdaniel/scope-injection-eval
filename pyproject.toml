[project]
name = "scopeeval"
version = "0.1.0"
description = "Measuring indirect prompt injection against tool-using agents under scoped permissions, with clinical-validation-style reporting."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["anthropic>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
scopeeval = "scopeeval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scopeeval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
